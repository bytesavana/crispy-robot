name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macos, mtaapal-deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        run: docker compose -f docker-compose.deploy.yml up -d --build
